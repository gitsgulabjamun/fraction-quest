<title>Fraction Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: an island-hopping map of 12 chapters; each island opens a focused one-question-at-a-time play card. */
:root{
  --sky:#E9F6F3; --sky2:#D7EFEA; --paper:#FFFFFF; --ink:#2A2140; --ink2:#5B5272; --line:#CFE3DE;
  --coral:#FF6F8E; --coral-s:#FFE1E8; --teal:#1FAE9B; --teal-s:#D3F3EE; --butter:#FFC94D; --butter-s:#FFF1C9; --lilac:#8F7CF0; --lilac-s:#E9E4FF;
  --good:#1FA67A; --good-s:#DDF6EC; --bad:#E5484D; --bad-s:#FFE4E5; --warn:#D98A00; --warn-s:#FFF0D1;
  --crust:#F2B45A; --filling:#FF8FA8;
  --shadow:0 3px 0 rgba(42,33,64,.12);
  --f-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#17142A; --sky2:#201C38; --paper:#262143; --ink:#F3EEFF; --ink2:#B8AED6; --line:#3A3460;
  --coral:#FF7F9B; --coral-s:#4A2436; --teal:#3CCFB9; --teal-s:#173F3B; --butter:#FFD36B; --butter-s:#47391A; --lilac:#A897FF; --lilac-s:#2F2858;
  --good:#3FD39F; --good-s:#173D31; --bad:#FF6B70; --bad-s:#4A2023; --warn:#FFB84D; --warn-s:#47361A;
  --crust:#F2B45A; --filling:#FF8FA8; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --sky:#17142A; --sky2:#201C38; --paper:#262143; --ink:#F3EEFF; --ink2:#B8AED6; --line:#3A3460;
  --coral:#FF7F9B; --coral-s:#4A2436; --teal:#3CCFB9; --teal-s:#173F3B; --butter:#FFD36B; --butter-s:#47391A; --lilac:#A897FF; --lilac-s:#2F2858;
  --good:#3FD39F; --good-s:#173D31; --bad:#FF6B70; --bad-s:#4A2023; --warn:#FFB84D; --warn-s:#47361A;
  --crust:#F2B45A; --filling:#FF8FA8; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%, var(--sky2) 0 120px, transparent 121px), radial-gradient(circle at 88% 30%, var(--sky2) 0 90px, transparent 91px);}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.muted{color:var(--ink2)}
.tnum{font-variant-numeric:tabular-nums}

/* fractions in text */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-family:var(--f-display);font-weight:600;font-size:.95em}
.fr>span{padding:0 .18em}
.fr .num{border-bottom:2px solid currentColor}
.mx{display:inline-flex;align-items:center;font-family:var(--f-display);font-weight:600;gap:.05em}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:26px;color:var(--ink)}
.brand small{display:block;font-size:13px;color:var(--ink2);font-family:var(--f-body)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
.iconbtn{border:2px solid var(--line);background:var(--paper);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}

/* hero strip */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:22px}
.hero .say{font-family:var(--f-display);font-size:20px;font-weight:600}
.hero .sub{color:var(--ink2);font-size:14px}
.ring{position:relative;width:86px;height:86px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;text-align:center;line-height:1.05}
.ring b small{display:block;font-size:11px;font-family:var(--f-body);color:var(--ink2);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

.btn{border:none;border-radius:14px;padding:11px 18px;font-weight:800;font-size:16px;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.coral{background:var(--coral);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* map */
.map{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.isle{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:26px 26px 22px 22px;padding:14px 14px 12px;box-shadow:var(--shadow);min-width:0}
.isle.locked{opacity:.55}
.isle .ex{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:2px 9px;border-radius:999px;display:inline-block}
.isle h3{font-size:19px;margin:6px 0 0}
.isle .topic{font-size:13px;color:var(--ink2);margin-bottom:10px}
.isle .blob{position:absolute;right:12px;top:12px;width:44px;height:44px}
.lv{display:flex;align-items:center;gap:8px;width:100%;border:2px solid var(--line);background:var(--sky);border-radius:12px;padding:7px 10px;margin-top:6px;color:var(--ink);font-weight:800;font-size:14px;text-align:left}
.lv:hover:not([disabled]){border-color:var(--ink2)}
.lv[disabled]{cursor:not-allowed;color:var(--ink2)}
.lv .nm{flex:1;min-width:0}
.lv .nm small{display:block;font-weight:700;font-size:11px;color:var(--ink2)}
.stars{display:inline-flex;gap:1px}
.stars svg{width:15px;height:15px}
.learnlink{background:none;border:none;color:var(--ink2);font-weight:800;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px 0 0}
.c-coral .ex{background:var(--coral-s);color:var(--coral)} .c-teal .ex{background:var(--teal-s);color:var(--teal)}
.c-butter .ex{background:var(--butter-s);color:var(--warn)} .c-lilac .ex{background:var(--lilac-s);color:var(--lilac)}

/* play */
.play{max-width:760px;margin:0 auto}
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dots{display:flex;gap:6px;flex:1;min-width:0}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.half{background:var(--butter)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--lilac)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow)}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.tag{padding:2px 9px;border-radius:999px;background:var(--sky);border:1.5px solid var(--line)}
.tag.book{background:var(--butter-s);border-color:transparent;color:var(--warn)}
.tag.twist{background:var(--lilac-s);border-color:transparent;color:var(--lilac)}
.q{font-size:22px;font-weight:700;line-height:1.55;margin:4px 0 14px}
.q .fr{font-size:1em}
.figwrap{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:10px 0 16px}
.figwrap svg{max-width:100%;height:auto}
.figs4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 14px}
.figs4 div{text-align:center;font-weight:800;font-family:var(--f-display)}
.answer{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:center;margin:14px 0 6px}
.fin{display:inline-flex;align-items:center;gap:8px}
.fin .stack{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin .stack hr{width:100%;border:none;border-top:3px solid var(--ink);margin:0}
.box{width:76px;height:52px;border:2.5px solid var(--line);border-radius:12px;text-align:center;font-family:var(--f-display);font-size:24px;font-weight:600;background:var(--sky);color:var(--ink)}
.box.w{width:64px;height:64px}
.box.wide{width:150px}
.box:focus{border-color:var(--lilac);background:var(--paper);outline:none}
.unit{font-weight:800;color:var(--ink2)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.opt{border:2.5px solid var(--line);background:var(--sky);border-radius:14px;padding:12px 14px;font-size:17px;font-weight:700;color:var(--ink);text-align:left;min-height:56px}
.opt.sel{border-color:var(--lilac);background:var(--lilac-s)}
.opt.right{border-color:var(--good);background:var(--good-s)} .opt.wrong{border-color:var(--bad);background:var(--bad-s)}
.cmpwrap{display:flex;align-items:center;justify-content:center;gap:16px;font-size:30px}
.cmpbtns{display:flex;gap:10px;justify-content:center}
.cmpbtns .opt{width:72px;text-align:center;font-size:28px;font-family:var(--f-display)}
.slot{min-width:72px;height:64px;border:3px dashed var(--line);border-radius:14px;display:grid;place-items:center;font-size:30px;font-family:var(--f-display)}
.order{display:flex;flex-direction:column;gap:12px;width:100%}
.orow{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:8px;border-radius:14px;border:2px dashed var(--line);align-items:center}
.orow.pool{border-style:solid;background:var(--sky)}
.ochip{border:2.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;font-size:20px;color:var(--ink)}
.olabel{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px}
.ctrl{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:16px}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.fb.good{background:var(--good-s)} .fb.bad{background:var(--bad-s)} .fb.mid{background:var(--warn-s)} .fb.hint{background:var(--lilac-s)}
.fb h4{margin:0 0 4px;font-family:var(--f-display);font-size:19px;font-weight:600}
.fb ol{margin:6px 0 0;padding-left:20px} .fb li{margin:3px 0}
.fb p{margin:4px 0}
.hintbtn{display:inline-flex;align-items:center;gap:6px}

/* results */
.res{text-align:center;max-width:560px;margin:20px auto}
.res .bigstars svg{width:56px;height:56px}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px}
.stat span{font-size:12px;color:var(--ink2);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.badge svg{width:18px;height:18px;flex:none}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--butter-s);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:800;margin:4px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,16,36,.45);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--paper);border-radius:24px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:22px;border:2px solid var(--line)}
.sheet ul{padding-left:20px} .sheet li{margin:8px 0}
.learnbig{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.4;margin:8px 0 10px}
.think{background:var(--lilac-s);border-radius:14px;padding:12px 14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-weight:800;font-size:14px}
.field input{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--sky);color:var(--ink);font-family:inherit}

/* parent dashboard */
.dash h2{font-size:24px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 18px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px}
.tile small{display:block;color:var(--ink2);font-size:12px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.panel h3{font-size:18px;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:800}
.pill.g{background:var(--good-s);color:var(--good)} .pill.b{background:var(--bad-s);color:var(--bad)} .pill.m{background:var(--warn-s);color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px;border-bottom:2px solid var(--line)}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:0;height:100%}
.bars .bar{width:100%;max-width:28px;border-radius:6px 6px 0 0;background:var(--teal)}
.bars .bar.zero{background:var(--line);height:3px}
.bars .lbl{font-size:10px;color:var(--ink2);font-weight:700}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--teal)}
.note{font-size:13px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:800;z-index:60}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

@media (max-width:760px){
  .map{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .map{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr auto}
  .hero .mascot{display:none}
  .q{font-size:19px}
  .opts{grid-template-columns:1fr}
  .figs4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statrow{grid-template-columns:1fr 1fr 1fr}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.fb,.card{animation:pop .18s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mascot svg{animation:bob 2.6s ease-in-out infinite}
</style>

<script>
"use strict";
// ---- engine.js
// ---------- Exact fraction arithmetic ----------
function gcd(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function lcm(a, b){ return Math.abs(a * b) / gcd(a, b); }

class Frac {
  constructor(n, d = 1){
    if (d === 0) throw new Error('zero denominator');
    if (d < 0) { n = -n; d = -d; }
    this.rn = n; this.rd = d;               // raw (unreduced) parts, kept for "exact" checks
    const g = gcd(n, d); this.n = n / g; this.d = d / g;
  }
  static of(x){ return x instanceof Frac ? x : new Frac(x, 1); }
  add(o){ o = Frac.of(o); return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o){ o = Frac.of(o); return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o){ o = Frac.of(o); return new Frac(this.n * o.n, this.d * o.d); }
  div(o){ o = Frac.of(o); if (o.n === 0) throw new Error('divide by zero'); return new Frac(this.n * o.d, this.d * o.n); }
  cmp(o){ o = Frac.of(o); const x = this.n * o.d - o.n * this.d; return x < 0 ? -1 : x > 0 ? 1 : 0; }
  eq(o){ return this.cmp(o) === 0; }
  isInt(){ return this.d === 1; }
  val(){ return this.n / this.d; }
  recip(){ return new Frac(this.d, this.n); }
  // token strings understood by the prompt renderer
  tok(){ // simplest, mixed when > 1
    if (this.d === 1) return String(this.n);
    const neg = this.n < 0, a = Math.abs(this.n);
    if (a > this.d) { const w = Math.floor(a / this.d), r = a % this.d; return '{' + (neg ? '-' : '') + w + ' ' + r + '/' + this.d + '}'; }
    return '{' + (neg ? '-' : '') + a + '/' + this.d + '}';
  }
  tokImp(){ return this.d === 1 ? String(this.n) : '{' + this.n + '/' + this.d + '}'; }
  tokRaw(){ return this.rd === 1 ? String(this.rn) : '{' + this.rn + '/' + this.rd + '}'; }
  key(){ return this.n + '/' + this.d; }
  mixedParts(){ const a = Math.abs(this.n); return { w: Math.floor(a / this.d), n: a % this.d, d: this.d, neg: this.n < 0 }; }
}

// parse "3/4", "2_1/3", "2 1/3", "5"  (keeps raw parts)
function F(s){
  if (s instanceof Frac) return s;
  s = String(s).trim();
  let m = s.match(/^(-?)(\d+)[_ ](\d+)\/(\d+)$/);
  if (m) { const w = +m[2], n = +m[3], d = +m[4]; const f = new Frac((w * d + n) * (m[1] ? -1 : 1), d); f.mixed = { w, n, d }; return f; }
  m = s.match(/^(-?\d+)\/(\d+)$/);
  if (m) return new Frac(+m[1], +m[2]);
  m = s.match(/^-?\d+$/);
  if (m) return new Frac(+s, 1);
  throw new Error('bad fraction ' + s);
}

// ---------- Expression parser (BODMAS with "of" above x and ÷) ----------
function tokenize(expr){
  const out = []; let i = 0; const s = expr;
  while (i < s.length) {
    const c = s[i];
    if (c === ' ') { i++; continue; }
    const lit = s.slice(i).match(/^(\d+_\d+\/\d+|\d+\/\d+|\d+)/);
    if (lit) { out.push({ t: 'num', v: F(lit[1]), src: lit[1] }); i += lit[1].length; continue; }
    if (s.startsWith('of', i)) { out.push({ t: 'op', v: 'of' }); i += 2; continue; }
    if ('+-x×÷*'.includes(c)) { out.push({ t: 'op', v: c === '*' || c === '×' ? 'x' : c }); i++; continue; }
    if ('([{'.includes(c)) { out.push({ t: 'lp', v: c }); i++; continue; }
    if (')]}'.includes(c)) { out.push({ t: 'rp', v: c }); i++; continue; }
    throw new Error('bad char ' + c + ' in ' + expr);
  }
  return out;
}
function parseExpr(expr){
  const toks = tokenize(expr); let p = 0;
  const peek = () => toks[p], next = () => toks[p++];
  function primary(){
    const t = next();
    if (!t) throw new Error('unexpected end');
    if (t.t === 'num') return { k: 'n', v: t.v, src: t.src };
    if (t.t === 'lp') { const e = sum(); const r = next(); if (!r || r.t !== 'rp') throw new Error('missing )'); return { k: 'g', e, br: t.v }; }
    throw new Error('unexpected ' + JSON.stringify(t));
  }
  function ofx(){ let l = primary(); while (peek() && peek().v === 'of') { next(); l = { k: 'b', op: 'of', l, r: primary() }; } return l; }
  function prod(){ let l = ofx(); while (peek() && (peek().v === 'x' || peek().v === '÷')) { const op = next().v; l = { k: 'b', op, l, r: ofx() }; } return l; }

const R = {
  int(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); },
  pick(a){ return a[Math.floor(Math.random() * a.length)]; },
  shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  coprime(lo, hi, d){ let n; do { n = R.int(lo, hi); } while (gcd(n, d) !== 1); return n; },
  sample(n, k){ return R.shuffle([...Array(n).keys()]).slice(0, k); },
};

function randomShape(n){ // a figure with n equal parts
  const opts = [];
  for (let r = 1; r <= 4; r++) if (n % r === 0 && n / r <= 6) opts.push(fig.grid(r, n / r));
  if (n <= 10) opts.push(fig.pie(n));
  return R.pick(opts);
}

    if (inter) s += '<rect class="tick" data-i="' + i + '" x="' + (x - step / 2) + '" y="' + (y - 30) + '" width="' + step + '" height="60" fill="transparent" style="cursor:pointer"/>'; }
  if (at != null && at !== '') s += '<circle cx="' + (L + at * step) + '" cy="' + y + '" r="10" fill="var(--coral)" stroke="var(--ink)" stroke-width="2"/>';
  return '<svg viewBox="0 0 ' + Wd + ' 100" width="' + Wd + '" height="100" role="img" style="max-width:100%">' + s + '</svg>';
}

const RANKS = [['Crumb', 0], ['Slice', 150], ['Quarter', 400], ['Half', 800], ['Whole', 1400], ['Double', 2200], ['Fraction Master', 3200], ['Fraction Legend', 4500]];
function rankOf(xp){ let r = RANKS[0], next = null; for (let i = 0; i < RANKS.length; i++) { if (xp >= RANKS[i][1]) { r = RANKS[i]; next = RANKS[i + 1] || null; } } return { name:r[0], next }; }
const BADGES = {
  first:['First Slice','Your first correct answer'], simpl:['Simplifier','20 answers simplified without a reminder'], nohint:['No Hints Hero','A full round with no hints'],
  twist:['Twist Tamer','Passed a Twist level'], hopper:['Island Hopper','Passed Explorer on 3 islands'], streak10:['On Fire','10 correct in a row'],
  perfect:['Perfect Ten','10 out of 10 first try'], book:['Bookworm','Every textbook question on an island solved'], goal3:['Steady Climber','Met the daily goal on 3 days'], crown:['Crown Wearer','Passed Crown Island Twist'],
};
function award(id){ if (S.badges[id]) return false; S.badges[id] = Date.now(); RUN && RUN.newBadges.push(id); return true; }
function levelUnlocked(w, L){
  if (S.settings.unlockAll) return true;
  if (w > 1 && w < 12 && !(W(w - 1).L2.best >= 7)) return false;
  if (w === 12 && [...Array(11)].filter((_, i) => W(i + 1).L2.best >= 7).length < 6) return false;
  if (L === 1) return true; if (L === 2) return W(w).L1.best >= 7 || W(w).L2.rounds > 0; return W(w).L2.best >= 7 || W(w).L3.rounds > 0;
}
const starsFor = best => best >= 10 ? 3 : best >= 8.5 ? 2 : best >= 7 ? 1 : 0;

// ---------------- Generic hints ----------------
const GH = {
  meaning:['Count all the EQUAL parts. That number goes on the bottom.','Count the parts you want. That number goes on top.'],
  collection:['What is the whole here? How many in total?','The part goes on top, the whole on the bottom. Then simplify.'],
  numline:['How many equal jumps are there between 0 and 1?','Each jump is one piece of that size. Count jumps from 0.'],
  proper:['Compare the numerator with the denominator.','Top smaller than bottom means less than 1.'],
  mixed:['Mixed to improper: wholes × denominator, then add the numerator.','Improper to mixed: divide. The remainder goes on top.'],
  equiv:['Multiply or divide top AND bottom by the same number.','What was the denominator multiplied by?'],
  simplest:['Find a number that divides both the top and bottom.','Keep dividing until only 1 divides both. The HCF does it in one go.'],
  compare:['Same denominator? Compare tops. Same numerator? The smaller bottom wins.','Otherwise cross multiply, or use a common denominator.'],
  order:['Use one common denominator for all of them.','Then put the numerators in order.'],
  addlike:['The pieces are the same size, so just add (or subtract) the tops.','The denominator stays the same. Then simplify.'],
  addunlike:['Can you add pieces of different sizes? Make the denominators the same first.','Find the LCM of the denominators and rewrite both fractions.'],
  sub:['Make the denominators the same first.','For mixed numbers, change them to improper fractions first. That avoids borrowing trouble.'],
  mulwhole:['Multiply the whole number by the numerator. Keep the denominator.','Cancel common factors first to keep the numbers small.'],
  mulfrac:['Top × top and bottom × bottom.','Change mixed numbers into improper fractions FIRST. Cancel before multiplying.'],
  div:['Dividing by a fraction is multiplying by its reciprocal.','Keep the first, flip the second, then multiply.'],
  bodmas:['BODMAS: Brackets, Of, Division and Multiplication, Addition and Subtraction.','Do one step, rewrite the line, then the next step.'],
  word:['What do you know? What do you need to find?','Which operation joins them: add, subtract, multiply or divide?'],
};
function hintsFor(q){
  const hs = (q.hint && q.hint.length ? q.hint : GH[q.sk] || []).slice();
  if (q.e && q.sol && q.sol.length > 1) { const first = q.sol.find(l => !l.startsWith('<b>')); if (first) hs.push('First step: ' + first); }
  return hs.slice(0, 3);
}

// ---------------- Round building ----------------
function bookFor(w){ return (BOOK[w] || []).map(q => prepare(q)).filter(q => !q._broken); }
function buildRound(w, L){
  if (L === 1) {
    const all = bookFor(w); const seen = W(w).L1.seen;
    const unsolved = R.shuffle(all.filter(q => seen[q.id] !== 1)); const solved = R.shuffle(all.filter(q => seen[q.id] === 1));
    const out = unsolved.concat(solved).slice(0, 10);
    while (out.length < 10) out.push(makeQuestion(w, 2));
    return out;
  }
  const qs = []; const n = 10;
  if (L === 3 && w > 1 && w < 12) { for (let i = 0; i < 2; i++) { const pw = R.int(1, w - 1); qs.push(Object.assign(makeQuestion(pw, R.pick([2, 3])), { review:pw })); } }
  RUN_WORLD_HINT = w; pullRetries(qs, r => r.w === w, 2);
  while (qs.length < n) qs.push(makeQuestion(w, L));
  return R.shuffle(qs);
}
function pullRetries(qs, pred, max){
  const list = (S.retry || []).filter(pred).slice(0, max);
  list.forEach(r => { try {
    let q;
    if (r.gk && GEN[r.gk.w] && GEN[r.gk.w]['L' + r.gk.L] && GEN[r.gk.w]['L' + r.gk.L][r.gk.i]) q = makeSimilar(r.gk, r.sig, r.sk);
    else if (r.spec) { q = prepare(JSON.parse(JSON.stringify(r.spec))); q.gen = true; }
    if (!q || q._broken) return;
    q.id = 'r-' + Math.random().toString(36).slice(2, 8); q.retried = r; q.again = true; if (r.w && r.w !== RUN_WORLD_HINT) q.review = r.w; qs.push(q);
  } catch (_) {} });
}
let RUN_WORLD_HINT = 0;
function buildDailyMix(){
  const open = []; for (let w = 1; w <= 11; w++) if (levelUnlocked(w, 2)) open.push(w);
  if (!open.length) open.push(1);
  const skillAcc = sk => { const s = S.skills[sk]; return s && s.a >= 3 ? s.c / s.a : 0.6; };
  const weightOf = w => { const sks = new Set(bookFor(w).map(q => q.sk)); let worst = 1; sks.forEach(k => { worst = Math.min(worst, skillAcc(k)); }); return 1.4 - worst; };
  const weights = open.map(weightOf); const tot = weights.reduce((a, b) => a + b, 0);
  RUN_WORLD_HINT = 0; const qs = []; pullRetries(qs, () => true, 4); while (qs.length < 10) { let r = Math.random() * tot, i = 0; while (r > weights[i] && i < weights.length - 1) { r -= weights[i]; i++; } qs.push(Object.assign(makeQuestion(open[i], levelUnlocked(open[i], 3) && Math.random() < .5 ? 3 : 2), { review:open[i] })); }
  return qs;
}

const SKILLNAME = { meaning:'Meaning of a fraction', collection:'Fraction of a collection', numline:'Number line', proper:'Proper and improper', mixed:'Mixed fractions', equiv:'Equivalent fractions', simplest:'Simplest form', compare:'Comparing', order:'Ordering', addlike:'Adding like fractions', addunlike:'Adding unlike fractions', sub:'Subtraction', mulwhole:'Fraction × whole number', mulfrac:'Fraction × fraction', div:'Division', bodmas:'BODMAS', word:'Word problems', other:'Other' };
function parentGate(){

  document.body.appendChild(m); const inp = $('#pin', m); setTimeout(() => inp.focus(), 50);
  const ok = async () => { const v = inp.value.trim(); if (!/^\d{4}$/.test(v)) { $('#pinerr', m).textContent = 'Use exactly 4 digits.'; return; } await refreshProgress(); if (!hasPin && S.settings.pin && v !== S.settings.pin) { $('#pinerr', m).textContent = 'A PIN was already set on another device. Enter that PIN.'; inp.value = ''; return; } if (!hasPin && !S.settings.pin) { S.settings.pin = v; saveLocal(true); } else if (v !== S.settings.pin) { $('#pinerr', m).textContent = 'That PIN is not right.'; inp.value = ''; return; } m.remove(); go('parent', { tab:'report' }); };
  $('#po', m).onclick = ok; $('#pc', m).onclick = () => m.remove(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
}
const REPORT = { at:0, remote:false, err:'' };
async function loadLogs(){
  const local = Object.values(S.days); REPORT.at = Date.now();
  if (!DB) { REPORT.remote = false; REPORT.err = ''; return local; }
  try { const qs = await DB.collection('log').orderBy('date', 'desc').limit(30).get(); const remote = qs.docs.map(d => d.data()); const map = {}; local.forEach(d => map[d.date] = d); remote.forEach(d => { if (!map[d.date] || (d.att || 0) > (map[d.date].att || 0)) map[d.date] = d; }); REPORT.remote = true; REPORT.err = ''; return Object.values(map); }
  catch (e) { REPORT.remote = false; REPORT.err = (e && (e.message || e.code)) || 'unknown'; return local; }
}
async function renderParent(app){
  app.innerHTML = '<p class="muted">Loading report…</p>';
  await refreshProgress();
  const logs = (await loadLogs()).sort((a, b) => a.date < b.date ? 1 : -1);
  const tk = dayKey(); const t = logs.find(d => d.date === tk) || { att:0, cor:0, first:0, hints:0, ms:0, sessions:[], attempts:[], skills:{}, worlds:{} };
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
  let html = '<div class="dash"><div class="top"><button class="iconbtn" id="pback" aria-label="Back">' + ICON.back + '</button><div class="brand"><div><h1>Parent report</h1><small>' + esc(S.player.name || 'No player yet') + ' · ' + (SYNC.mode === 'cloud' ? 'synced online' : MODE.kind === 'demo' ? 'demo, this browser only' : 'saved on this device only') + '</small></div></div><button class="btn ghost small" id="tabR">Report</button><button class="btn ghost small" id="tabS">Settings</button></div>'
    + (VIEW.tab === 'settings' ? '' : '<div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px"><span class="note tnum" style="flex:1;min-width:200px">' + (DB ? (REPORT.remote ? 'Live from the server, updated ' + fmtTime(REPORT.at) + '.' : '<b style="color:var(--bad)">Could not reach the server</b> (' + esc(REPORT.err) + '). Showing what this device has.') : MODE.kind === 'demo' ? 'Demo data from this browser.' : 'Data saved on this device.') + '</span><button class="btn ghost small" id="prefresh">Refresh</button></div>');
  if (VIEW.tab === 'settings') { app.innerHTML = html + settingsHtml() + '</div>'; wireParent(); wireSettings(); return; }
  const last = logs.find(d => d.att > 0); const lastAt = last && last.attempts && last.attempts.length ? last.attempts[last.attempts.length - 1].t : null;
  html += '<div class="tiles"><div class="tile"><span>Active today</span><b>' + mins(t.ms) + ' min</b><small>Goal ' + S.settings.goalMin + ' min</small></div><div class="tile"><span>Questions today</span><b>' + t.att + '</b><small>' + t.first + ' right on first try</small></div><div class="tile"><span>Accuracy today</span><b>' + pct(t.cor, t.att) + '</b><small>' + t.hints + ' hints used</small></div><div class="tile"><span>Last practice</span><b style="font-size:20px">' + (lastAt ? (dayKey(lastAt) === tk ? 'Today ' : last.date.slice(5) + ' ') + fmtTime(lastAt) : 'Never') + '</b><small>Day streak ' + dayStreak() + '</small></div></div>';
  // 14 day bars
  const days = [...Array(14)].map((_, i) => dayKey(Date.now() - (13 - i) * 86400000)); const by = {}; logs.forEach(d => by[d.date] = d); const maxMin = Math.max(S.settings.goalMin, ...days.map(k => by[k] ? mins(by[k].ms) : 0));
  html += '<div class="panel"><h3>Last 14 days</h3><div class="bars">' + days.map(k => { const d = by[k]; const m = d ? mins(d.ms) : 0; return '<div class="col" title="' + k + ': ' + m + ' min, ' + (d ? d.att : 0) + ' questions, ' + (d ? pct(d.cor, d.att) : '–') + ' correct"><span class="lbl tnum">' + (m || '') + '</span><div class="bar' + (m ? '' : ' zero') + '" style="height:' + (m ? Math.max(4, 100 * m / maxMin) : 0) + '%"></div></div>'; }).join('') + '</div><div style="display:flex;gap:6px">' + days.map(k => '<div class="bars lbl" style="flex:1;text-align:center;height:auto;border:none;font-size:10px;color:var(--ink2)">' + k.slice(8) + '</div>').join('') + '</div><p class="note">Bars show active minutes. Hover a bar for questions and accuracy.</p></div>';
  // daily table
  html += '<div class="panel"><h3>Day by day</h3><div class="scroll"><table class="tbl tnum"><thead><tr><th>Date</th><th>Minutes</th><th>Questions</th><th>Correct</th><th>First try</th><th>Hints</th><th>Sessions</th></tr></thead><tbody>' + logs.filter(d => d.att || d.ms).slice(0, 14).map(d => '<tr><td>' + d.date + '</td><td>' + mins(d.ms) + '</td><td>' + d.att + '</td><td>' + pct(d.cor, d.att) + '</td><td>' + pct(d.first, d.att) + '</td><td>' + d.hints + '</td><td>' + (d.sessions || []).map(s => fmtTime(s.s) + '–' + fmtTime(s.e)).join(', ') + '</td></tr>').join('') + '</tbody></table></div></div>';
  // islands
  html += '<div class="panel"><h3>Islands</h3><div class="scroll"><table class="tbl"><thead><tr><th>Island</th><th>Textbook solved</th><th>Warm-up</th><th>Explorer</th><th>Twist</th></tr></thead><tbody>';
  for (let w = 1; w <= 12; w++) { const ws = W(w); const bn = bookFor(w).length; const sv = Object.values(ws.L1.seen).filter(v => v === 1).length; const cell = L => ws['L' + L].rounds ? starsHtml(starsFor(ws['L' + L].best)) + ' <span class="note tnum">best ' + ws['L' + L].best + '</span>' : '<span class="note">not tried</span>'; html += '<tr><td><b>' + (w === 12 ? 'Revision' : WORLDS[w].ex) + '</b> ' + WORLDS[w].topic + '</td><td class="tnum">' + sv + ' / ' + bn + '</td><td>' + cell(1) + '</td><td>' + cell(2) + '</td><td>' + cell(3) + '</td></tr>'; }
  html += '</tbody></table></div></div>';
  // skills
  const sks = Object.entries(S.skills).filter(([, v]) => v.a > 0).sort((a, b) => a[1].c / a[1].a - b[1].c / b[1].a);
  html += '<div class="panel"><h3>Skills, weakest first</h3>' + (sks.length ? '<div class="scroll"><table class="tbl tnum"><thead><tr><th>Skill</th><th>Attempts</th><th>Score</th><th></th></tr></thead><tbody>' + sks.map(([k, v]) => { const p = Math.round(100 * v.c / v.a); return '<tr><td>' + (SKILLNAME[k] || k) + '</td><td>' + v.a + '</td><td><span class="pill ' + (p >= 80 ? 'g' : p >= 55 ? 'm' : 'b') + '">' + p + '%</span></td><td style="width:40%"><div class="meter"><i style="width:' + p + '%"></i></div></td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="note">No questions answered yet.</p>') + '<p class="note">Score counts a first-try answer as 1 and an answer fixed after a hint or retry as half.</p></div>';
  // mistakes
  const mistakes = logs.flatMap(d => d.attempts || []).filter(a => a.ok < 1).sort((a, b) => b.t - a.t).slice(0, 30);
  html += '<div class="panel"><h3>Recent mistakes and near misses</h3>' + (mistakes.length ? '<div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>Question</th><th>Her answer</th><th>Correct</th><th>Result</th></tr></thead><tbody>' + mistakes.map(a => '<tr><td class="tnum">' + dayKey(a.t).slice(5) + ' ' + fmtTime(a.t) + '</td><td>' + esc(a.q) + (a.bk ? ' <span class="pill m">book</span>' : '') + '</td><td>' + esc(a.g || '–') + '</td><td>' + esc(a.x) + '</td><td>' + (a.ok > 0 ? '<span class="pill m">fixed' + (a.h ? ' with hint' : '') + (a.nu ? ', needed simplifying' : '') + '</span>' : '<span class="pill b">wrong</span>') + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="note">No mistakes yet. Nice.</p>') + '</div>';
  // badges
  html += '<div class="panel"><h3>Badges</h3>' + (Object.keys(S.badges).length ? Object.keys(S.badges).map(b => '<span class="badge">' + ICON.star(true) + BADGES[b][0] + '</span>').join('') : '<p class="note">None yet.</p>') + '</div></div>';
  app.innerHTML = html; wireParent();
}
function wireParent(){ const rf = $('#prefresh'); if (rf) rf.onclick = () => go('parent', { tab:'report' }); $('#pback').onclick = () => go('home'); $('#tabR').onclick = () => go('parent', { tab:'report' }); $('#tabS').onclick = () => go('parent', { tab:'settings' }); }
function settingsHtml(){
  const st = S.settings;
  return '<div class="panel"><h3>Daily goal</h3><div class="field"><label for="goal">Active minutes per day</label><input id="goal" type="number" min="10" max="180" value="' + st.goalMin + '"></div></div>'
    + '<div class="panel"><h3>PIN</h3><div class="field"><label for="npin">New 4 digit PIN</label><input id="npin" inputmode="numeric" maxlength="4" type="password" autocomplete="off"></div></div>'
    + '<div class="panel"><h3>Levels</h3><label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="unl" ' + (st.unlockAll ? 'checked' : '') + '> Unlock every island and level</label><p class="note">Normally an island opens after Explorer on the island before it is passed.</p><label style="display:flex;gap:8px;align-items:center;font-weight:700;margin-top:8px"><input type="checkbox" id="snd" ' + (st.sound ? 'checked' : '') + '> Sound effects</label></div>'
    + (MODE.kind === 'web' ? '<div class="panel"><h3>Evening report</h3><p class="note">The server sends a report every evening between 8:30 and 9:30 PM.' + (MODE.health ? ' Email: ' + (MODE.health.email ? 'on' : 'not set up') + '. Telegram: ' + (MODE.health.telegram ? 'on' : 'not set up') + '.' : '') + '</p><button class="btn ghost small" id="reptest">Send today\'s report now</button><pre id="repres" class="note" style="white-space:pre-wrap;margin-top:10px"></pre><p class="note">On a shared device, you can make it forget the family code: <button class="btn ghost small" id="forget">Forget family code</button></p></div>' : '')
    + (MODE.kind !== 'file' ? '' : '<div class="panel"><h3>Telegram alerts</h3><p class="note">Works when the game is opened as a file on this computer. Inside Claude, use the daily email instead. Create a bot with @BotFather, paste its token, then send your bot any message and paste your chat id (from @userinfobot).</p><div class="field"><label for="tgt">Bot token</label><input id="tgt" value="' + esc(st.tgToken) + '" autocomplete="off"></div><div class="field"><label for="tgc">Chat id</label><input id="tgc" value="' + esc(st.tgChat) + '" autocomplete="off"></div><button class="btn ghost small" id="tgtest">Send a test message</button> <span id="tgres" class="note"></span></div>')
    + '<div class="panel"><h3>Reset</h3><p class="note">Type RESET and press the button to wipe all progress on this device' + (DB ? ' and in the cloud' : '') + '.</p><div class="field"><input id="rst" placeholder="RESET" autocomplete="off"></div><button class="btn ghost small" id="rstb">Wipe progress</button></div>'
    + '<div class="ctrl"><span class="note">Sync: ' + SYNC.mode + (SYNC.last ? ', last saved ' + fmtTime(SYNC.last) : '') + (SYNC.err ? ', last error ' + esc(SYNC.err) : '') + '</span><button class="btn" id="ssave">Save settings</button></div>';

function wireSettings(){
  $('#ssave').onclick = async () => { await refreshProgress(); const st = S.settings; const g = +$('#goal').value; if (g >= 10 && g <= 180) st.goalMin = g; const np = $('#npin').value.trim(); if (np) { if (!/^\d{4}$/.test(np)) return toast('PIN must be 4 digits'); st.pin = np; } st.unlockAll = $('#unl').checked; st.sound = $('#snd').checked; if ($('#tgt')) { st.tgToken = $('#tgt').value.trim(); st.tgChat = $('#tgc').value.trim(); } saveLocal(true); toast('Settings saved'); };
  const rt = $('#reptest'); if (rt) rt.onclick = async () => { $('#repres').textContent = 'Sending…'; try { const j = await DB.call('POST', '/api/report?test=1&date=' + dayKey(), {}); $('#repres').textContent = (j.sent.email || j.sent.telegram ? 'Sent by ' + [j.sent.email && 'email', j.sent.telegram && 'Telegram'].filter(Boolean).join(' and ') + '.' : (j.note || 'Not sent: ' + (j.errors || []).join(', '))) + '\n\n' + j.text; } catch (e) { $('#repres').textContent = 'Could not send: ' + (e.message || e.code); } };
  const fg = $('#forget'); if (fg) fg.onclick = () => { lsSet('fq.familyCode', null); location.reload(); };
  const tt = $('#tgtest'); if (tt) tt.onclick = async () => { S.settings.tgToken = $('#tgt').value.trim(); S.settings.tgChat = $('#tgc').value.trim(); saveLocal(); const ok = await tgSend('Fraction Quest is connected. You will get round updates for ' + S.player.name + '.'); $('#tgres').textContent = ok ? 'Sent. Check Telegram.' : 'Could not send. Check the token and chat id, and open the game as a local file.'; };
  $('#rstb').onclick = async () => { if ($('#rst').value !== 'RESET') return toast('Type RESET first'); const keep = S.settings; S = DEFAULT_STATE(); S.settings = keep; PLAYER = S.player; saveLocal(true); if (DB) { try { await DB.doc('progress/main').set(progressDoc()); } catch (_) {} } toast('Progress wiped'); go('home'); };
}

// ---------------- Boot ----------------
(async () => {
  await detectMode();
  loadLocal();
  if (MODE.kind === 'web' && !familyCode()) return renderGate($('#app'));
  if (MODE.kind === 'web' || (!S.player.name && MODE.kind === 'artifact')) { await Promise.race([initDb(), new Promise(r => setTimeout(r, 5000))]); if (SYNC.err === 'unauthorized') { lsSet('fq.familyCode', null); return renderGate($('#app'), 'That family code no longer works. Enter it again.'); } route(); }
  else { route(); initDb(); }
  if (ssGet('fq.parentNext') === '1') { ssSet('fq.parentNext', null); parentGate(); }
})();

function renderGate(app, msg){
  app.innerHTML = '<div class="play" style="max-width:520px;margin-top:6vh"><div class="card" style="text-align:center"><div class="mascot">' + mascot('wow', 96) + '</div><h1 style="font-size:32px;margin:8px 0">Fraction Quest</h1>'

    + '<div class="field" style="text-align:left"><label for="fcode">Family code</label><input id="fcode" type="password" autocomplete="current-password" placeholder="Enter your family code"></div><p class="note" id="gerr" style="min-height:1.2em">' + esc(msg || '') + '</p>'

setTimeout(() => { if (MODE.kind === 'file') maybeTelegramDaily(); }, 4000);
